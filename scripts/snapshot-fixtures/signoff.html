<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Off — W-1042</title>
  <link rel="stylesheet" href="file:///Users/shawnscomputer/Documents/iaw-saas/frontend/src/styles.css" />
</head>
<body>
  <div class="form-page signoff-page">
    <button type="button" class="back-btn">← Back</button>
    <h2>Sign Off — W-1042</h2>
    <p class="signoff-route">🚩 Acme Warehouse ➡️ Gamma Depot</p>
    <form>
      <label>Printed Name</label>
      <input value="Alex Rivera" placeholder="Printed Name" readonly />
      <label>Recipient Signature</label>
      <canvas id="signature-canvas" width="400" height="150" class="signature-canvas"></canvas>
      <label>Proof of Delivery Photo</label>
      <input type="file" class="file-input" />
      <span class="pod-file-label">📷 pod-w1042.jpg</span>
      <button type="button" class="btn-primary">✔ COMPLETE DELIVERY & SIGN OFF</button>
    </form>
  </div>
  <script>
    const canvas = document.getElementById('signature-canvas');
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(40, 90);
    ctx.bezierCurveTo(80, 40, 140, 130, 200, 70);
    ctx.bezierCurveTo(240, 40, 280, 110, 340, 85);
    ctx.stroke();
  </script>
</body>
</html>
